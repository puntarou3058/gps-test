<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>あいねえナビ5号｜電子コンパス診断</title>
<style>body{margin:0;background:#101827;color:#f5f8ff;font-family:system-ui,sans-serif;text-align:center;padding:24px 16px}h1{font-size:23px}p{line-height:1.6}.panel{max-width:440px;margin:20px auto;padding:20px;background:#1c2a40;border-radius:18px}.compass{position:relative;width:230px;height:230px;border:3px solid #91a4be;border-radius:50%;margin:20px auto;background:radial-gradient(circle,#273c58,#152238)}.north{position:absolute;top:8px;left:0;right:0;font-weight:bold;color:#ffb0ad}.needle{position:absolute;left:calc(50% - 9px);top:30px;width:18px;height:170px;transform-origin:50% 85px;transition:transform .12s linear}.needle:before{content:"";position:absolute;top:0;left:0;border-left:9px solid transparent;border-right:9px solid transparent;border-bottom:85px solid #ff6868}.needle:after{content:"";position:absolute;top:85px;left:0;border-left:9px solid transparent;border-right:9px solid transparent;border-top:85px solid #6fb5ff}.center{position:absolute;top:calc(50% - 8px);left:calc(50% - 8px);background:white;width:16px;height:16px;border-radius:50%}button{font-size:17px;font-weight:bold;border:0;border-radius:12px;background:#61cbeb;color:#0c1b2c;padding:14px 25px}#degree{font-size:42px;font-weight:bold}small{color:#c5d0e2}#status{color:#ffdf91;white-space:pre-line} .meta{font-size:14px;text-align:left;line-height:1.8} </style></head>
<body><h1>🧭 あいねえナビ 5号</h1><p>電子コンパス単体テスト<br>スマホを水平に持って、その場でゆっくり回してな！</p><div class="panel"><button id="start">センサー測定を開始</button><div class="compass"><div class="north">N</div><div class="needle" id="needle"></div><div class="center"></div></div><div id="degree">--°</div><div id="mode">未測定</div><p id="status">開始ボタンを押してな</p><div class="meta"><div>受信回数：<span id="count">0</span></div><div>alpha（端末回転）：<span id="alpha">--</span></div><div>絶対方位：<span id="absolute">--</span></div><div>最終受信：<span id="last">--</span></div></div></div><small>※ 5号は地図やGPSを変更しない診断専用版。<br>絶対方位が取れない場合は相対回転だけ表示します。<br>HTTPS上のChrome等で試してください。</small>
<script>
const $=id=>document.getElementById(id);let count=0,firstAlpha=null,started=false,received=false;
function norm(n){return (n%360+360)%360}
function handle(e){received=true;count++;$('count').textContent=count;$('last').textContent=new Date().toLocaleTimeString();$('alpha').textContent=Number.isFinite(e.alpha)?e.alpha.toFixed(1)+'°':'取得不可';$('absolute').textContent=String(e.absolute??'不明');
let heading=null,mode='';if(Number.isFinite(e.webkitCompassHeading)){heading=norm(e.webkitCompassHeading);mode='絶対方位（webkitCompassHeading）';}
else if(e.absolute===true&&Number.isFinite(e.alpha)){heading=norm(360-e.alpha);mode='絶対方位（absolute alpha）';}
else if(Number.isFinite(e.alpha)){if(firstAlpha===null)firstAlpha=e.alpha;heading=norm(firstAlpha-e.alpha);mode='相対回転のみ（北の方向は不明）';}
if(heading!==null){$('degree').textContent=heading.toFixed(1)+'°';$('mode').textContent=mode;$('needle').style.transform='rotate('+heading+'deg)';$('status').textContent='センサー受信中。スマホを回して数値が変わるか確認！';}else{$('status').textContent='イベントは届いたけど角度が取得できへん。';}}
$('start').addEventListener('click',async()=>{if(started)return; $('status').textContent='センサーの接続を確認中…';try{if(!window.isSecureContext){$('status').textContent='HTTPSで開いてください。';return;}if(!('DeviceOrientationEvent'in window)){$('status').textContent='このブラウザはDeviceOrientationに非対応です。';return;}
if(typeof DeviceOrientationEvent.requestPermission==='function'){let permission=await DeviceOrientationEvent.requestPermission();if(permission!=='granted'){$('status').textContent='センサーの許可が得られませんでした。';return;}}
window.addEventListener('deviceorientationabsolute',handle);window.addEventListener('deviceorientation',handle);started=true;$('start').textContent='測定中';$('start').disabled=true;setTimeout(()=>{if(!received)$('status').textContent='方位データが届きません。Chromeのサイト権限・モーションセンサー設定を確認してください。';},3500);
}catch(err){$('status').textContent='開始エラー：'+err.message;}});
</script></body></html>
